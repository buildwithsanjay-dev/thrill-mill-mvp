<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Thrill Mill Sunday Reel</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Playfair Display"; src: url("fonts/PlayfairDisplay-VF.ttf") format("truetype"); font-weight: 400 900; }
      @font-face { font-family: "Great Vibes"; src: url("fonts/GreatVibes-Regular.ttf") format("truetype"); }
      @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat-VF.ttf") format("truetype"); font-weight: 100 900; }

      :root {
        --gold: #f7cf4a;
        --gold-deep: #e9a21b;
        --ivory: #fffaf0;
        --navy: #0b2545;
        --teal: #0e7c86;
        --orange: #ea5f14;
        --cream: #f3eee4;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }

      /* Picture edit (built by build-edit.mjs). The untimed wrapper carries every camera move. */
      #vwrap { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform, filter; }
      #base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* Warm light leak + flash layers */
      #leak {
        position: absolute; inset: -20%; pointer-events: none; mix-blend-mode: screen; opacity: 0;
        background:
          radial-gradient(40% 30% at 18% 22%, rgba(255, 170, 70, 0.95), rgba(255, 120, 40, 0) 70%),
          radial-gradient(35% 25% at 85% 12%, rgba(255, 214, 120, 0.8), rgba(255, 200, 100, 0) 70%);
      }
      #flash { position: absolute; inset: 0; background: #fffdf6; opacity: 0; pointer-events: none; }
      #shade {
        position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.30) 22%, rgba(0,0,0,0) 44%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.32) 100%);
      }

      .txt { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .serif {
        font-family: "Playfair Display", serif; font-weight: 900; color: var(--gold); line-height: 0.95; white-space: nowrap;
        text-shadow: 0 2px 4px rgba(40, 22, 0, 0.55), 0 0 26px rgba(255, 190, 60, 0.45), 0 8px 26px rgba(0, 0, 0, 0.45);
      }
      .script {
        font-family: "Great Vibes", cursive; color: var(--ivory); line-height: 1.05;
        text-shadow: 0 0 18px rgba(255, 240, 210, 0.55), 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      .caps {
        font-family: "Montserrat", sans-serif; font-weight: 700; color: var(--ivory);
        letter-spacing: 0.22em; text-transform: uppercase;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
      }
      .word { display: inline-block; }

      /* Positions — sky band for wide shots, lower band for the close-up at the table */
      #t1 { top: 190px; }
      #t1 .serif { font-size: 210px; letter-spacing: 0.06em; }
      #t1 .script { font-size: 84px; margin-top: 4px; }
      #t2 { top: 430px; }
      #t2 .script { font-size: 104px; }
      #t3 { top: 330px; }
      #t3 .caps { font-size: 44px; }
      #t3 .serif { font-size: 128px; margin-top: 14px; letter-spacing: 0.01em; }
      #t4 { top: 1215px; }
      #t4 .script { font-size: 108px; }
      #t5 { top: 300px; }
      #t5 .serif { font-size: 150px; letter-spacing: 0.04em; }
      #t5 #t5a1 { font-size: 112px; letter-spacing: 0.12em; }
      #t5 .script { font-size: 82px; margin-top: 18px; }
      #heart { width: 74px; height: 74px; margin-top: 18px; }

      /* End card — matches the club's own reels: logo on cream */
      #card { position: absolute; inset: 0; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #mark { width: 560px; height: 560px; mix-blend-mode: multiply; }
      #clubname { font-family: "Montserrat", sans-serif; font-weight: 800; color: var(--navy); font-size: 70px; letter-spacing: 0.04em; margin-top: -30px; }
      #tagline { font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.32em; margin-top: 22px; color: var(--teal); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.667" data-width="1080" data-height="1920">
      <div id="vwrap">
        <video id="base" class="clip" src="assets/base.mp4" data-start="0" data-duration="21.667" data-track-index="0" muted playsinline></video>
      </div>
      <div id="shade"></div>
      <div id="leak"></div>

      <!-- HOOK: film-title style, Tamil-reel "ft." convention -->
      <div id="t1" class="txt clip" data-start="0.3" data-duration="2.25" data-track-index="2">
        <div class="serif" id="t1a">SUNDAY</div>
        <div class="script" id="t1b">ft. the Thrill Mill family</div>
      </div>

      <!-- ARRIVAL -->
      <div id="t2" class="txt clip" data-start="2.85" data-duration="2.95" data-track-index="2">
        <div class="script" id="t2a">
          <span class="word">we</span> <span class="word">came</span> <span class="word">for</span> <span class="word">a</span> <span class="word">little</span> <span class="word">fun...</span>
        </div>
      </div>

      <!-- ENERGY: lands on the music lift at 6.0s -->
      <div id="t3" class="txt clip" data-start="6.0" data-duration="3.15" data-track-index="2">
        <div class="caps" id="t3a">then the energy went</div>
        <div class="serif" id="t3b">VERA LEVEL</div>
      </div>

      <!-- SURPRISE -->
      <div id="t4" class="txt clip" data-start="10.9" data-duration="2.95" data-track-index="2">
        <div class="script" id="t4a">
          <span class="word">&amp;</span> <span class="word">a</span> <span class="word">few</span> <span class="word">sweet</span> <span class="word">surprises</span>
        </div>
      </div>

      <!-- BOND -->
      <div id="t5" class="txt clip" data-start="16.35" data-duration="3.5" data-track-index="2">
        <div id="t5a"><div class="serif" id="t5a1">ONE BIG</div><div class="serif" id="t5a2">FAMILY</div></div>
        <div class="script" id="t5b">good people &middot; good vibes</div>
        <svg id="heart" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#e63946" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 5 6.4 5c2 0 3.4 1.1 4.1 2.3h3c.7-1.2 2.1-2.3 4.1-2.3C21 5 23.1 8.5 21.6 11.8 19.5 16.4 12 21 12 21z" />
        </svg>
      </div>

      <section id="card" class="clip" data-start="20.0" data-duration="1.667" data-track-index="3">
        <img id="mark" src="assets/logo-mark.png" alt="Thrill Mill Club" />
        <div id="clubname">THE THRILL MILL CLUB</div>
        <div id="tagline"><span id="tagline-text">PLAY · COMPETE · CONNECT</span></div>
      </section>

      <div id="flash"></div>
    </div>

    <script>
      // Split titles into per-letter spans: spacing "collapse" is animated as glyph x (sub-pixel smooth),
      // never as letter-spacing (which snaps to whole pixels in frame-by-frame capture).
      const split = (sel) => {
        const el = document.querySelector(sel);
        const chars = [...el.textContent];
        el.textContent = "";
        chars.forEach((c) => {
          const sp = document.createElement("span");
          sp.className = "ch";
          sp.style.display = "inline-block";
          sp.style.whiteSpace = "pre";
          sp.textContent = c;
          el.appendChild(sp);
        });
        return el.querySelectorAll(".ch");
      };
      const spread = (chs, px) => (i) => (i - (chs.length - 1) / 2) * px;
      const t1Chars = split("#t1a");
      const t5Chars = [...split("#t5a1"), ...split("#t5a2")];
      const tagChars = split("#tagline-text");

      const tl = gsap.timeline({ paused: true });
      const ni = { immediateRender: false };

      // ---------- camera moves on the picture wrapper (all seek-safe fromTo) ----------
      const cam = (t, d, from, to, ease = "power2.out", first = false) =>
        tl.fromTo("#vwrap", from, { ...to, duration: d, ease, ...(first ? {} : ni) }, t);
      const still = { scale: 1, x: 0, filter: "blur(0px)" };
      cam(0, 2.667, { scale: 1.08, x: 0, filter: "blur(0px)" }, { scale: 1.0 }, "sine.out", true); // hook: gentle pull-out
      cam(2.667, 0.01, still, still, "none");
      // 6.0 — zoom-blur punch into the energy section
      cam(5.85, 0.15, { scale: 1.0, x: 0, filter: "blur(0px)" }, { scale: 1.14, filter: "blur(14px)" }, "power2.in");
      cam(6.0, 0.32, { scale: 1.14, x: 0, filter: "blur(14px)" }, { scale: 1.0, filter: "blur(0px)" }, "power3.out");
      // beat bumps on the next two cuts
      cam(8.0, 0.25, { scale: 1.05, x: 0, filter: "blur(0px)" }, { scale: 1.0 }, "power2.out");
      cam(9.333, 0.25, { scale: 1.04, x: 0, filter: "blur(0px)" }, { scale: 1.0 }, "power2.out");
      // surprises: slow, warm push-in
      cam(10.667, 3.2, { scale: 1.0, x: 0, filter: "blur(0px)" }, { scale: 1.06 }, "sine.inOut");
      // 14.0 — whip into the tee reveal
      cam(13.87, 0.13, { scale: 1.06, x: 0, filter: "blur(0px)" }, { scale: 1.16, x: -150, filter: "blur(18px)" }, "power2.in");
      cam(14.0, 0.2, { scale: 1.16, x: 150, filter: "blur(18px)" }, { scale: 1.02, x: 0, filter: "blur(0px)" }, "power3.out");
      // 16.0 — the group reveal: settle from a soft zoom, then a slow emotional push
      cam(16.0, 0.6, { scale: 1.12, x: 0, filter: "blur(10px)" }, { scale: 1.0, filter: "blur(0px)" }, "power3.out");
      cam(16.6, 3.4, { scale: 1.0, x: 0, filter: "blur(0px)" }, { scale: 1.05 }, "sine.inOut");

      // ---------- flashes (white glow cuts, the club's house transition) ----------
      tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.08, ease: "none", ...ni }, 5.95);
      tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.3, ease: "power2.out", ...ni }, 6.03);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.12, ease: "sine.in", ...ni }, 10.55);
      tl.fromTo("#flash", { opacity: 0.35 }, { opacity: 0, duration: 0.35, ease: "sine.out", ...ni }, 10.67);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none", ...ni }, 15.92);
      tl.fromTo("#flash", { opacity: 0.45 }, { opacity: 0, duration: 0.45, ease: "power2.out", ...ni }, 16.02);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.in", ...ni }, 19.85);
      tl.fromTo("#flash", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", ...ni }, 20.0);

      // ---------- light leaks ----------
      const leak = (t, d, peak) => {
        tl.fromTo("#leak", { opacity: 0, x: -60 }, { opacity: peak, x: 0, duration: d * 0.45, ease: "sine.inOut", ...ni }, t);
        tl.fromTo("#leak", { opacity: peak, x: 0 }, { opacity: 0, x: 60, duration: d * 0.55, ease: "sine.inOut", ...ni }, t + d * 0.45);
      };
      tl.set("#leak", { opacity: 0 }, 0);
      leak(0.0, 2.6, 0.32);
      leak(10.6, 2.4, 0.28);
      leak(16.0, 3.4, 0.3);

      // ---------- text ----------
      // T1 SUNDAY: letter-spacing collapse + blur resolve, script rises after
      tl.fromTo("#t1a", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0.3);
      tl.fromTo(t1Chars, { x: spread(t1Chars, 70) }, { x: 0, duration: 0.8, ease: "power3.out" }, 0.3);
      tl.fromTo("#t1b", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.75);
      tl.to(["#t1a", "#t1b"], { opacity: 0, y: -18, duration: 0.25, ease: "power2.in" }, 2.3);

      // T2: word stagger
      tl.fromTo("#t2a .word", { opacity: 0, y: 22, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, stagger: 0.09, ease: "power2.out" }, 2.85);
      tl.to("#t2a", { opacity: 0, duration: 0.25, ease: "power1.in" }, 5.55);

      // T3: caps slide, VERA LEVEL punches in on the lift
      tl.fromTo("#t3a", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.05);
      tl.fromTo("#t3b", { opacity: 0, scale: 1.35, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "back.out(1.6)" }, 6.25);
      tl.fromTo("#t3b", { scale: 1 }, { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.out", ...ni }, 8.0);
      tl.to(["#t3a", "#t3b"], { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, 8.9);

      // T4
      tl.fromTo("#t4a .word", { opacity: 0, y: 22, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, stagger: 0.1, ease: "power2.out" }, 10.9);
      tl.to("#t4a", { opacity: 0, duration: 0.25, ease: "power1.in" }, 13.6);

      // T5 + heart pop
      tl.set("#heart", { opacity: 0, scale: 0.2 }, 0);
      tl.fromTo("#t5a", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 16.35);
      tl.fromTo(t5Chars, { x: (i) => (i < 7 ? (i - 3) : (i - 9.5)) * 26 }, { x: 0, duration: 0.8, ease: "power3.out" }, 16.35);
      tl.fromTo("#t5b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 16.95);
      tl.fromTo("#heart", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)", ...ni }, 17.45);
      tl.fromTo("#heart", { scale: 1 }, { scale: 1.12, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut", ...ni }, 18.0);
      tl.to(["#t5a", "#t5b", "#heart"], { opacity: 0, duration: 0.2, ease: "power1.in" }, 19.65);

      // End card
      tl.fromTo("#mark", { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 20.05);
      tl.fromTo("#clubname", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 20.35);
      tl.fromTo("#tagline", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 20.55);
      tl.fromTo(tagChars, { x: spread(tagChars, 9) }, { x: 0, duration: 0.7, ease: "power2.out" }, 20.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
